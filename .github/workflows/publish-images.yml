name: Publish Docker images

# Builds the MusicDeck server and web images and publishes them to GHCR so
# self-hosted deployments can `docker compose pull` without needing the
# source repository or any local build context.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --ci

  test-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust -> target
      - name: Run Rust tests
        run: cargo test --locked

  # The legacy Playwright fixtures instantiate Fastify directly. They are excluded
  # from release gating until their backend fixtures are migrated to Rust.

  test-server-image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production server image
        uses: docker/build-push-action@v6
        with:
          context: ./server-rust
          file: ./server-rust/Dockerfile
          target: runtime
          load: true
          tags: musicdeck-server:music-root-test
          cache-from: type=gha,scope=musicdeck-server
          cache-to: type=gha,scope=musicdeck-server,mode=max

      - name: Verify Rust runtime startup
        run: |
          container="musicdeck-rust-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container" || true
            docker rm --force --volumes "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            -e MUSICDECK_HOST=0.0.0.0 \
            -e MUSICDECK_PORT=4534 \
            -e MUSICDECK_ENV=production \
            -e MUSICDECK_PUBLIC_URL=http://localhost:4534 \
            -e MUSICDECK_SECURE_COOKIES=false \
            -e MUSICDECK_SESSION_SECRET=ci-only-session-secret \
            -e MUSICDECK_ADMIN_PASSWORD=ci-only-admin-password \
            musicdeck-server:music-root-test
          for attempt in $(seq 1 60); do
            if docker exec "$container" gosu musicdeck curl --fail --silent \
              http://127.0.0.1:4534/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Rust server did not become healthy within 120 seconds." >&2
          exit 1

      - name: Test music-root permissions
        run: |
          sed -i 's/\r$//' ./scripts/test-docker-music-root.sh
          bash ./scripts/test-docker-music-root.sh

  build-and-push:
    needs: [test-web, test-server, test-server-image]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musicdeck-server
            context: ./server-rust
            target: runtime
          - name: musicdeck-web
            context: ./webapp
            target: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        id: owner
        # GHCR image paths must be lowercase, but the GitHub owner is
        # "UserPhase". Without this the published package name would not
        # match the ghcr.io/userphase/... references in docker-compose.yml.
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.name }}
          # `latest` tracks the default branch; production Compose defaults use
          # a published commit tag shared by the web and server images.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Make package public
        # GHCR packages are PRIVATE on first publish, which would make
        # `docker compose pull` fail for self-hosters with a 403/denied
        # error. GITHUB_TOKEN cannot change package visibility, so this
        # uses an optional PAT (scope: read:packages, write:packages,
        # delete:packages). If the secret is absent we skip and print the
        # one-time manual step instead of failing the build.
        env:
          PAT: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
          PACKAGE: ${{ matrix.name }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::notice::GHCR_VISIBILITY_TOKEN not set. Make the package public once, manually:"
            echo "::notice::https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/settings -> Change visibility -> Public"
            exit 0
          fi
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE}" \
            -d '{"visibility":"public"}')
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PACKAGE} is public."
          else
            echo "::warning::Could not set visibility (HTTP $code). Set it manually in package settings."
            cat /tmp/resp.json || true
          fi
