name: Publish Docker images

# Builds the MusicDeck server and web images and publishes them to GHCR so
# self-hosted deployments can `docker compose pull` without needing the
# source repository or any local build context.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --ci

  test-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server-rust
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust -> target
      - name: Run Rust tests
        run: cargo test --locked

  # The legacy Playwright fixtures instantiate Fastify directly. They are excluded
  # from release gating until their backend fixtures are migrated to Rust.

  test-server-image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production server image
        uses: docker/build-push-action@v7
        with:
          context: ./server-rust
          file: ./server-rust/Dockerfile
          target: runtime
          load: true
          tags: musicdeck-server:music-root-test
          cache-from: type=gha,scope=musicdeck-server
          cache-to: type=gha,scope=musicdeck-server,mode=max

      - name: Build production web gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./webapp
          file: ./webapp/Dockerfile
          target: production
          load: true
          tags: musicdeck-web:gateway-test
          cache-from: type=gha,scope=musicdeck-web
          cache-to: type=gha,scope=musicdeck-web,mode=max

      - name: Verify playback through the production gateway
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="musicdeck-smoke-$suffix"
          server="musicdeck-server-$suffix"
          gateway="musicdeck-gateway-$suffix"
          provider="musicdeck-provider-$suffix"
          database="/app/data/musicdeck-smoke.sqlite"
          gateway_url="http://127.0.0.1:14534"
          browser_origin="http://musicdeck.example.test:14534"
          cleanup() {
            for container in "$gateway" "$server" "$provider"; do
              docker logs "$container" || true
              docker rm --force --volumes "$container" >/dev/null 2>&1 || true
            done
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network"
          docker run --detach --name "$provider" --network "$network" \
            --network-alias provider \
            --mount "type=bind,src=$PWD/scripts/test-docker-gateway.py,dst=/smoke.py,readonly" \
            python:3.13-alpine python -u /smoke.py provider
          docker run --detach --name "$server" --network "$network" \
            --network-alias musicdeck-server --tmpfs /music:ro \
            -e MUSICDECK_ENV=production \
            -e "MUSICDECK_DB_PATH=$database" \
            -e "MUSICDECK_PUBLIC_URL=$browser_origin" \
            -e MUSICDECK_SECURE_COOKIES=false \
            -e MUSICDECK_SESSION_SECRET=ci-only-session-secret \
            -e MUSICDECK_ADMIN_PASSWORD=ci-only-admin-password \
            -e MUSIC_BACKEND=navidrome \
            -e NAVIDROME_URL=http://provider:8090 \
            -e NAVIDROME_USERNAME=smoke -e NAVIDROME_PASSWORD=smoke \
            musicdeck-server:music-root-test
          docker run --detach --name "$gateway" --network "$network" \
            --publish 127.0.0.1:14534:80 musicdeck-web:gateway-test
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent --max-time 4 "$gateway_url/api/health" > /tmp/musicdeck-health.json; then
              jq -e '.ok and .database.connected and (.degradedCapabilities | index("musicStorage") != null)' /tmp/musicdeck-health.json
              filters=$(docker exec "$server" gosu musicdeck ffmpeg -hide_banner -filters)
              grep -Eq '[[:space:]]silencedetect[[:space:]]' <<< "$filters"
              grep -Eq '[[:space:]]loudnorm[[:space:]]' <<< "$filters"
              docker exec -i "$server" gosu musicdeck python3 - seed "$database" < scripts/test-docker-gateway.py
              python3 scripts/test-docker-gateway.py verify "$gateway_url" "$browser_origin"
              exit 0
            fi
            sleep 2
          done
          echo "MusicDeck gateway did not become healthy within 120 seconds." >&2
          exit 1

      - name: Test music-root permissions
        run: |
          sed -i 's/\r$//' ./scripts/test-docker-music-root.sh
          bash ./scripts/test-docker-music-root.sh

  build-and-push:
    needs: [test-web, test-server, test-server-image]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musicdeck-server
            context: ./server-rust
            target: runtime
          - name: musicdeck-web
            context: ./webapp
            target: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        id: owner
        # GHCR image paths must be lowercase, but the GitHub owner is
        # "UserPhase". Without this the published package name would not
        # match the ghcr.io/userphase/... references in docker-compose.yml.
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.name }}
          # `latest` tracks the default branch; production Compose defaults use
          # a published commit tag shared by the web and server images.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
