name: Build Desktop App (Windows .exe)

# Builds the MusicDeck Tauri v2 Windows desktop installer (.exe and .msi),
# uploads it as a workflow artifact on every build, and attaches it to a
# GitHub Release so you can download the .exe directly from GitHub.

on:
  push:
    branches: ["main"]
    tags: ["v*", "desktop-v*"]
    paths:
      - "Desktop-App/**"
      - "webapp/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./Desktop-App/src-tauri -> target"

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Install Desktop-App dependencies
        working-directory: Desktop-App
        run: npm install

      - name: Validate Desktop-App configuration
        working-directory: Desktop-App
        run: |
          npm test
          npm run validate

      - name: Build Tauri Windows installers (.exe & .msi)
        working-directory: Desktop-App
        env:
          MUSICDECK_BUILD_SHA: ${{ github.sha }}
        run: npx tauri build

      - name: Generate auto-updater latest.json manifest
        shell: pwsh
        run: |
          $tauriConf = Get-Content "Desktop-App/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $tauriConf.version
          $exeFile = Get-ChildItem -Path "Desktop-App/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            throw "NSIS .exe installer was not found."
          }
          $sha256 = (Get-FileHash -Path $exeFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseTag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "desktop-latest" }
          $encodedName = [uri]::EscapeDataString($exeFile.Name)
          $installerUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$releaseTag/$encodedName"

          $manifest = [ordered]@{
            version      = $version
            buildId      = $env:GITHUB_SHA
            publishedAt  = (Get-Date).ToUniversalTime().ToString("o")
            notes        = "MusicDeck Desktop v$version ($($env:GITHUB_SHA.Substring(0, 7)))"
            installerUrl = $installerUrl
            sha256       = $sha256
          }
          $manifestPath = "Desktop-App/src-tauri/target/release/bundle/latest.json"
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path $manifestPath -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content $manifestPath

      - name: Upload Windows .exe, .msi, and latest.json artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicDeck-Windows-x64-Installer
          path: |
            Desktop-App/src-tauri/target/release/bundle/nsis/*.exe
            Desktop-App/src-tauri/target/release/bundle/msi/*.msi
            Desktop-App/src-tauri/target/release/bundle/latest.json
            Desktop-App/src-tauri/target/release/musicdeck-desktop.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish .exe installer and latest.json to GitHub Releases (latest desktop build)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "desktop-latest"
          $title = "MusicDeck Desktop (Latest Windows Build)"
          $notes = "Automated Windows desktop build from commit $($env:GITHUB_SHA)."
          $files = Get-ChildItem -Path "Desktop-App/src-tauri/target/release/bundle/nsis/*.exe", "Desktop-App/src-tauri/target/release/bundle/msi/*.msi", "Desktop-App/src-tauri/target/release/bundle/latest.json"

          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files.FullName --clobber
            gh release edit $tag --title $title --notes $notes
          } else {
            gh release create $tag $files.FullName --title $title --notes $notes --prerelease
          }

      - name: Publish .exe installer and latest.json to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "MusicDeck Desktop $tag"
          $notes = "MusicDeck Desktop Windows installers for $tag."
          $files = Get-ChildItem -Path "Desktop-App/src-tauri/target/release/bundle/nsis/*.exe", "Desktop-App/src-tauri/target/release/bundle/msi/*.msi", "Desktop-App/src-tauri/target/release/bundle/latest.json"

          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files.FullName --clobber
          } else {
            gh release create $tag $files.FullName --title $title --notes $notes
          }

          # Also update the desktop-latest release manifest so running clients auto-update to this tag
          gh release view "desktop-latest" >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload "desktop-latest" "Desktop-App/src-tauri/target/release/bundle/latest.json" --clobber
          } else {
            gh release create "desktop-latest" "Desktop-App/src-tauri/target/release/bundle/latest.json" --title "MusicDeck Desktop (Latest Windows Build)" --notes $notes --prerelease
          }
