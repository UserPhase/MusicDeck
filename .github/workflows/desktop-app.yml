name: Build Desktop App (Windows .exe)

# Builds and signs the per-user MusicDeck NSIS installer for unattended updates.

on:
  push:
    branches: ["main"]
    tags: ["v*", "desktop-v*"]
    paths:
      - "Desktop-App/**"
      - "webapp/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:

concurrency:
  group: musicdeck-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            Desktop-App/package-lock.json

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./Desktop-App/src-tauri -> target"

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Install Desktop-App dependencies
        working-directory: Desktop-App
        run: npm ci

      - name: Validate Desktop-App configuration
        working-directory: Desktop-App
        run: |
          npm test
          npm run validate

      - name: Test desktop Rust runtime
        working-directory: Desktop-App/src-tauri
        run: cargo test --locked --lib

      - name: Build and sign the per-user NSIS installer
        working-directory: Desktop-App
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Set the TAURI_UPDATER_PUBLIC_KEY repository variable and the TAURI_SIGNING_PRIVATE_KEY secret before publishing desktop updates.'
          }
          $config = Join-Path $env:RUNNER_TEMP 'musicdeck-tauri-signing.json'
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:TAURI_UPDATER_PUBLIC_KEY.Trim() } }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          npx tauri build --config $config --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare signed release assets and update manifest
        shell: pwsh
        run: |
          $tauriConf = Get-Content 'Desktop-App/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $tauriConf.version
          $bundle = 'Desktop-App/src-tauri/target/release/bundle'
          $installer = @(Get-ChildItem -Path "$bundle/nsis/*-setup.exe")
          if ($installer.Count -ne 1) { throw 'Expected one NSIS setup executable.' }
          $installer = $installer[0]
          $signature = (Get-Content -LiteralPath "$($installer.FullName).sig" -Raw).Trim()
          if (-not $signature) { throw 'The NSIS setup executable has no updater signature.' }

          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'desktop-latest' }
          $build = $env:GITHUB_SHA.Substring(0, 12)
          $name = "MusicDeck_${version}_x64_${build}-setup.exe"
          $installerUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$([uri]::EscapeDataString($tag))/$name"
          $publishedAt = [DateTime]::UtcNow.ToString('o')
          $distribution = New-Item -ItemType Directory -Path "$bundle/distribution" -Force
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $distribution.FullName $name)
          Copy-Item -LiteralPath "$($installer.FullName).sig" -Destination (Join-Path $distribution.FullName "$name.sig")

          # Preserve the legacy manifest fields so 0.1.x NSIS clients can update to the signed updater.
          $platform = @{ signature = $signature; url = $installerUrl }
          [ordered]@{
            version = $version
            notes = "MusicDeck Desktop v$version"
            pub_date = $publishedAt
            platforms = @{ 'windows-x86_64-nsis' = $platform; 'windows-x86_64' = $platform }
            buildId = $env:GITHUB_SHA
            publishedAt = $publishedAt
            installerUrl = $installerUrl
            sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $distribution.FullName 'latest.json') -Encoding utf8NoBOM

      - name: Upload signed Windows installer and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: MusicDeck-Windows-x64-Installer
          path: Desktop-App/src-tauri/target/release/bundle/distribution/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed installer and then update the feed
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'desktop-latest' }
          $title = if ($tag -eq 'desktop-latest') { 'MusicDeck Desktop (Latest Windows Build)' } else { "MusicDeck Desktop $tag" }
          $notes = "Automated Windows desktop build from commit $($env:GITHUB_SHA)."
          $distribution = 'Desktop-App/src-tauri/target/release/bundle/distribution'
          $assets = @(Get-ChildItem -Path "$distribution/*-setup.exe", "$distribution/*-setup.exe.sig")
          $manifest = "$distribution/latest.json"
          $releases = "repos/$env:GITHUB_REPOSITORY/releases"
          $releaseId = gh api --paginate "${releases}?per_page=100" --jq '.[] | { tag: .tag_name, id: .id } | @json' |
            ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.tag -ceq $tag } |
            Select-Object -ExpandProperty id

          if ($tag -eq 'desktop-latest' -and $releaseId) {
            $feedAssetId = gh api --paginate "$releases/$releaseId/assets?per_page=100" --jq '.[] | select(.name == "latest.json") | .id'
            if ($feedAssetId) {
              $current = gh api "$releases/assets/$feedAssetId" -H 'Accept: application/octet-stream' | ConvertFrom-Json
              $candidate = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
              if (-not $current.version -or -not $candidate.version) {
                throw 'Both desktop manifests must contain a version.'
              }
              $publishedVersion = [semver]$current.version
              $candidateVersion = [semver]$candidate.version
              if ($candidateVersion -lt $publishedVersion) {
                throw "Desktop feed already serves $publishedVersion. Refusing to publish older version $candidateVersion."
              }
              if ($candidateVersion -eq $publishedVersion) {
                Write-Output "Desktop feed already serves $publishedVersion. Keeping the published installer and manifest."
                exit 0
              }
            }
          }

          if (-not $releaseId) {
            $arguments = @('release', 'create', $tag, '--title', $title, '--notes', $notes)
            if ($tag -eq 'desktop-latest') { $arguments += '--prerelease' }
            gh @arguments
          }
          gh release upload $tag $assets.FullName --clobber
          gh release upload $tag $manifest --clobber
