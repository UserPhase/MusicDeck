[package]
name = "musicdeck-desktop"
version = "0.2.0"
description = "MusicDeck Tauri Desktop Client"
authors = ["MusicDeck"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "musicdeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "net", "io-util", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
getrandom = "0.3"
tempfile = "3"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
