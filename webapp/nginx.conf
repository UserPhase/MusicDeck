# This file is included from nginx's http context (conf.d/default.conf).
# A TLS-terminating reverse proxy must sit in front of this HTTP container in
# production. Preserve its HTTPS scheme for the server and browsers.
map $http_x_forwarded_proto $musicdeck_forwarded_proto {
  https   https;
  default $scheme;
}

# The final URI gives SPA fallbacks the same cache policy as index.html.
map $uri $musicdeck_asset_cache_control {
  default "";
  "~^/static/.+\.[0-9a-f]{8,}\." "public, max-age=31536000, immutable";
  ~^/(?:index\.html|service-worker\.js|asset-manifest\.json|manifest\.json|favicon\.ico|musicdeck-(?:icon\.svg|192\.png|512\.png))$ "no-cache";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; re-resolve the upstream on every request so
  # container restarts/IP changes don't leave nginx pointing at a dead IP.
  resolver 127.0.0.11 valid=10s;

  # This container speaks plain HTTP. HSTS must be sent by the actual TLS
  # terminator (Caddy/Nginx/Traefik/ingress) so onboarding HTTP LAN mode
  # doesn't accidentally pin clients to HTTPS.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control $musicdeck_asset_cache_control;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; script-src 'self' https://www.gstatic.com https://www.google.com; frame-src 'self' https://www.google.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;

  location = /api/v1/remote {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $musicdeck_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # Server-Sent Events (acquisition/download progress). These must NOT be
  # buffered or nginx will hold the stream and the UI will never receive
  # live progress updates. Declared before the generic /api/ block because
  # nginx prefers the longest matching prefix location.
  location /api/acquisitions/events {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $musicdeck_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 24h;
  }

  # Plain HTTP API traffic (REST calls, downloads, artwork, streaming).
  location = /api/v1/cast/stream {
    access_log off;
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $musicdeck_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location /api/ {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $musicdeck_forwarded_proto;

    # Audio streaming and artwork can be large and are range-requested by
    # the browser's <audio> element. Disable response buffering so seeking
    # stays responsive and nginx doesn't spool whole files to disk first.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Plugin installation and playlist imports post payloads larger than
    # nginx's 1m default, which would otherwise fail with 413.
    client_max_body_size 512m;
  }

  # Additional WebSocket integrations share the same single-origin proxy.
  location /ws/ {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $musicdeck_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  location /static/ {
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css image/svg+xml;
    try_files $uri =404;
  }

  location = /service-worker.js {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
