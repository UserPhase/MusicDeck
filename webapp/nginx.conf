server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; re-resolve the upstream on every request so
  # container restarts/IP changes don't leave nginx pointing at a dead IP.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
