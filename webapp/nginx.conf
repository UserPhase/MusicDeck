server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; re-resolve the upstream on every request so
  # container restarts/IP changes don't leave nginx pointing at a dead IP.
  resolver 127.0.0.11 valid=10s;

  # Plain HTTP API traffic (REST calls, downloads, artwork, streaming).
  location /api/ {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket upgrade support. MusicDeck Server does not currently open
  # WebSocket connections, but this keeps the single-origin proxy ready for
  # any future real-time features (and correctly forwards the Upgrade/
  # Connection headers if a client ever does attempt one) without requiring
  # clients to know about the internal server port.
  location /ws/ {
    set $musicdeck_upstream musicdeck-server;
    proxy_pass http://$musicdeck_upstream:4534;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
