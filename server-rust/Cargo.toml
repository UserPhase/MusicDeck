# ==============================================================================
# MusicDeck Rust Backend (`server-rust`)
# High-concurrency, zero-GC asynchronous HTTP/WebSocket/SSE server built on
# Tokio and Axum for Navidrome and Jellyfin audio streaming orchestration.
# ==============================================================================

[package]
name = "musicdeck-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "High-performance asynchronous Rust backend for the MusicDeck audio streaming platform"
authors = ["MusicDeck Contributors"]
license = "MIT"
publish = false

# Expose a library target so integration tests (`tests/*.rs`) and auxiliary CLI
# binaries (`init_db`, `shrink_library`) can instantiate `app()` / `create_router()`
# directly in-memory without binding an OS TCP socket.
[lib]
name = "musicdeck_server"
path = "src/lib.rs"

# Primary production server executable entry point.
[[bin]]
name = "musicdeck-server"
path = "src/main.rs"

# Standalone database initialization, migration, and backfill CLI utility.
[[bin]]
name = "init_db"
path = "src/bin/init_db.rs"

# Standalone library storage optimizer CLI utility (`shrink_library`).
[[bin]]
name = "shrink_library"
path = "src/bin/shrink_library.rs"

[dependencies]
# Asynchronous runtime: multi-threaded work-stealing scheduler, async TCP/UDP
# networking, filesystem I/O, timers, synchronization primitives, and OS signals.
tokio = { version = "=1.43.0", features = ["full"] }

# Web framework: ergonomic routing, extractors, WebSocket upgrade support,
# multipart uploads, HTTP/1.1 & HTTP/2, and handler state injection.
axum = { version = "=0.7.9", features = [
  "macros",
  "ws",
  "multipart",
  "json",
  "tokio",
  "http1",
  "http2",
  "matched-path",
  "original-uri",
  "query",
] }

# Service abstraction layer and composable middleware combinators.
tower = { version = "=0.5.2", features = [
  "util",
  "timeout",
  "limit",
] }

# HTTP-specific Tower middleware: CORS policy enforcement, structured request
# tracing, security response headers, payload limits, and panic recovery.
tower-http = { version = "=0.6.2", features = [
  "cors",
  "trace",
  "set-header",
  "compression-gzip",
  "limit",
  "request-id",
  "sensitive-headers",
  "catch-panic",
] }

# Core HTTP types (StatusCode, HeaderMap, HeaderName, HeaderValue, Method, Uri).
http = "=1.2.0"

# Structured, span-aware diagnostic instrumentation and subscriber formatting.
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }
tracing-appender = "=0.2.3"

# High-performance regular expressions, fast byte scanning, and timestamps.
regex = "=1.11.1"
memchr = "=2.7.4"
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std", "serde"] }

# Asynchronous SQLite connection pool with WAL and compile-time/runtime query support.
sqlx = { version = "=0.8.3", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }

# CLI argument parsing, password hashing (Argon2id + legacy Bcrypt cost 12), JWT, HMAC, and IDs.
clap = { version = "=4.5.31", features = ["derive", "env"] }
bcrypt = "=0.17.0"
argon2 = { version = "=0.5.3", features = ["std"] }
password-hash = { version = "=0.5.0", features = ["getrandom"] }
jsonwebtoken = "=9.3.1"
hmac = "=0.12.1"
sha2 = "=0.10.8"
unicode-normalization = "=0.1.24"
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tokio-util = { version = "=0.7.13", features = ["io"] }
nanoid = "=0.4.0"

# Safe binary image decoding/resizing (JPEG, PNG, WebP), base64, gzip, tar, and URL encoding.
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "=0.22.1"
flate2 = "=1.1.0"
tar = "=0.4.43"
urlencoding = "=2.1.3"

# Asynchronous HTTP client pool, trait polymorphism, and Subsonic MD5 token hashing.
async-trait = "=0.1.86"
bytes = "=1.10.0"
futures-util = "=0.3.31"
reqwest = { version = "=0.12.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
md-5 = "=0.10.6"

# Zero-copy-capable serialization and deserialization for REST & WebSocket payloads.
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_with = "=3.12.0"

# Network CIDR/IP parsing, URL validation, .env loading, and atomic file UUIDs.
ipnet = { version = "=2.11.0", features = ["serde"] }
dotenvy = "=0.15.7"
url = { version = "=2.5.4", features = ["serde"] }
uuid = { version = "=1.13.1", features = ["v4", "serde"] }

# Ergonomic `std::error::Error` derive macro for domain and transport error types.
thiserror = "=2.0.11"

[dev-dependencies]
# Enables `ServiceExt::oneshot` for driving `axum::Router` in unit tests without TCP.
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.2"
tempfile = "=3.17.1"
pretty_assertions = "=1.4.1"
approx = "=0.5.1"

# Enforce memory safety and strict lint hygiene across the entire crate.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
double_must_use = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
type_complexity = "allow"
doc_lazy_continuation = "allow"

# Production release profile tuned for low tail-latency during concurrent range streaming.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
